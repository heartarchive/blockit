name: BlockIt

options:
  bundleIdPrefix: com.blockit
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  BlockIt:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BlockIt
      - path: Shared
    info:
      path: BlockIt/Resources/Info.plist
    entitlements:
      path: BlockIt/Resources/BlockIt.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blockit.app
        PRODUCT_NAME: BlockIt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
    dependencies:
      - target: BlockItMonitor
        embed: true
        codeSign: true

  BlockItMonitor:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BlockItMonitor
      - path: Shared
    info:
      path: BlockItMonitor/Info.plist
    entitlements:
      path: BlockItMonitor/BlockItMonitor.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blockit.app.monitor
        PRODUCT_NAME: BlockItMonitor
        SKIP_INSTALL: YES
